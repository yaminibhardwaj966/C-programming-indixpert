<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy New Year 🎉</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      font-family: "Segoe UI", sans-serif;
    }

    .card {
      background: #ffffff;
      padding: 30px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      max-width: 300px;
      animation: pop 1s ease;
    }

    @keyframes pop {
      0% {
        transform: scale(0.7);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #ff6f61;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 15px;
      color: #333;
    }

    p {
      font-size: 16px;
      color: #555;
      line-height: 1.5;
    }

    .emoji {
      font-size: 40px;
      margin: 15px 0;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .footer {
      margin-top: 20px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🎉 Happy New Year 2026 🎉</h1>
    <div class="emoji">🥳✨</div>
    <h2>Wishing You</h2>
    <p>
      A year full of happiness,<br>
      good health, success,<br>
      and beautiful moments 💖
    </p>
    <div class="footer">
      — Best wishes 🌸
    </div>
  </div>

</body>
</html>
